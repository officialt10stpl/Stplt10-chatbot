<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>stpl-t10</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- STPL T10 Pro AI चैटबॉट विजेट -->
    <div id="stpl-chat-widget" style="position: fixed; bottom: 25px; right: 25px; z-index: 9999; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
      
      <!-- चैट बॉक्स विंडो -->
      <div id="chat-box" style="display: none; width: 340px; height: 460px; background: #ffffff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); flex-direction: column; overflow: hidden; border: 1px solid #e2e8f0;">
        
        <!-- हेडर -->
        <div style="background: linear-gradient(135deg, #1e293b, #0f172a); color: #fff; padding: 14px 18px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; font-size: 15px;">
          <span style="display: flex; align-items: center; gap: 6px;">🏏 STPL T10 Pro Assistant</span>
          <span onclick="toggleChat()" style="cursor: pointer; font-size: 20px; font-weight: normal; color: #94a3b8; transition: color 0.2s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#94a3b8'">✕</span>
        </div>

        <!-- मैसेज एरिया -->
        <div id="chat-messages" style="flex: 1; padding: 14px; overflow-y: auto; font-size: 14px; background: #f8fafc; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth;">
          <div style="background: #e2e8f0; padding: 10px 14px; border-radius: 12px; max-width: 85%; color: #334155; line-height: 1.4; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">अरे हेलो भाई! स्वागत है STPL T10 में। ट्रायल, फीस या रजिस्ट्रेशन के बारे में क्या जानना चाहते हो?</div>
        </div>

        <!-- इनपुट एरिया -->
        <div style="padding: 10px 12px; background: #fff; display: flex; align-items: center; border-top: 1px solid #e2e8f0; gap: 8px;">
          <input type="text" id="user-input" placeholder="यहाँ कुछ भी पूछें (जैसे: fees, bating)..." style="flex: 1; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 14px; transition: border-color 0.2s;" onfocus="this.style.borderColor='#2563eb'" onblur="this.style.borderColor='#cbd5e1'" onkeypress="if(event.key === 'Enter') sendWebMessage()">
          <button onclick="sendWebMessage()" style="background: #2563eb; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; transition: background 0.2s;" onmouseover="this.style.background='#1d4ed8'" onmouseout="this.style.background='#2563eb'">भेजें</button>
        </div>
      </div>
      
      <!-- फ्लोटिंग चैट बटन -->
      <div onclick="toggleChat()" style="background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; cursor: pointer; box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4); transition: transform 0.2s, box-shadow 0.2s;" onmouseover="this.style.transform='scale(1.08)'; this.style.boxShadow='0 8px 25px rgba(37, 99, 235, 0.6)'" onmouseout="this.style.transform='scale(1)'; this.style.boxShadow='0 6px 20px rgba(37, 99, 235, 0.4)'">💬</div>
    </div>

    <script>
      function toggleChat() {
        const box = document.getElementById('chat-box');
        box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
      }

      async function sendWebMessage() {
        const input = document.getElementById('user-input');
        const message = input.value.trim();
        if (!message) return;

        const messagesDiv = document.getElementById('chat-messages');
        
        // यूजर का मैसेज
        messagesDiv.innerHTML += `<div style="background: #dbeafe; padding: 10px 14px; border-radius: 12px; max-width: 85%; margin-left: auto; text-align: right; color: #1e3a8a; line-height: 1.4; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">${message}</div>`;
        input.value = '';
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        try {
          const response = await fetch('https://stplt10-chatbot-new.onrender.com/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: message })
          });
          const data = await response.json();

          const botReply = data.reply ? data.reply : "अरे भाई, सर्वर से सही जवाब नहीं मिला!";

          // बॉट का जवाब
          messagesDiv.innerHTML += `<div style="background: #e2e8f0; padding: 10px 14px; border-radius: 12px; max-width: 85%; color: #334155; line-height: 1.4; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">${botReply}</div>`;
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
        } catch (err) {
          messagesDiv.innerHTML += `<div style="background: #fee2e2; padding: 10px 14px; border-radius: 12px; max-width: 85%; color: #991b1b; line-height: 1.4;">अरे भाई, सर्वर से कनेक्ट करने में दिक्कत आ रही है। चेक करो कि सर्वर चालू है या नहीं!</div>`;
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
      }
    </script>
  </body>
</html>
